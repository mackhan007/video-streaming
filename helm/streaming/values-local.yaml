# Docker Desktop / laptop overlay — smaller IMS, no HPA, local images.
replicaCount:
  ems: 1
  ims: 3

service:
  # Docker Desktop's Kubernetes auto-exposes LoadBalancer services on
  # localhost — no kubectl port-forward needed to reach these.
  frontendType: LoadBalancer
  minioType: LoadBalancer

image:
  ems: ems:latest
  ims: ims-processor:latest
  frontend: frontend:latest
  pullPolicy: Never

ims:
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    cpuPercent: 70
  chunkSecs: 60
  # 3 replicas x encodeParallel jobs must fit in the box's real core count
  # (10 here) or every pod — IMS, Kafka's own readiness probe, everything —
  # gets starved to a crawl under CFS proportional-share scheduling.
  # Measured: even with 1080p dropped, a single packed 2-rung chunk job still
  # sustains ~1.4+ cores, so parallel: 2 (6 concurrent jobs, ~8.4+ cores just
  # for ffmpeg) re-oversubscribed the box — chunks ran but never finished in
  # a reasonable time. parallel: 1 (3 concurrent) is the config that actually
  # completed a full 49-chunk video (46 min, zero restarts) — verify any
  # future bump against a real timed run, not just theoretical CPU math.
  encodeParallel: 1
  preset: ultrafast
  enable720p: true
  enable1080p: false

env:
  CDN_BASE_URL: http://127.0.0.1:8081

resources:
  ems:
    requests:
      cpu: 100m
      memory: 256Mi
  ims:
    # requests is what sets each pod's CPU scheduling weight under
    # contention — limits only caps the ceiling. This was 250m against a
    # 4-core limit, so under load IMS pods got squeezed to a sliver of a
    # core combined instead of the cores the ffmpeg jobs actually needed.
    requests:
      cpu: "1"
      memory: 512Mi
    limits:
      cpu: "3"
      memory: 2Gi
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
  kafka:
    # No request at all previously meant BestEffort-tier CPU shares, so
    # kafka-broker-api-versions.sh (the readiness probe, a JVM subprocess
    # with a 10s timeout) starved under load and flapped Unready.
    requests:
      cpu: 500m
      memory: 768Mi
