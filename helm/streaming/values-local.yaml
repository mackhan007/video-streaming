# Docker Desktop / laptop overlay — smaller IMS, no HPA, local images.
replicaCount:
  ems: 1
  ims: 3

service:
  # Docker Desktop's Kubernetes auto-exposes LoadBalancer services on
  # localhost — no kubectl port-forward needed to reach the frontend.
  frontendType: LoadBalancer

image:
  ems: ems:latest
  ims: ims-processor:latest
  frontend: frontend:latest
  pullPolicy: Never

ims:
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    cpuPercent: 70
  chunkSecs: 60
  # 3 replicas x encodeParallel jobs, each running a 3-rung ffmpeg ladder,
  # must fit in the box's real core count (10 here) or every pod — IMS,
  # Kafka's own readiness probe, everything — gets starved to a crawl
  # under CFS proportional-share scheduling. Keep replicas x encodeParallel
  # comfortably under vCPU count.
  encodeParallel: 1
  preset: ultrafast

env:
  S3_PUBLIC_ENDPOINT: http://127.0.0.1:4566
  CDN_BASE_URL: http://127.0.0.1:8081

resources:
  ems:
    requests:
      cpu: 100m
      memory: 256Mi
  ims:
    # requests is what sets each pod's CPU scheduling weight under
    # contention — limits only caps the ceiling. This was 250m against a
    # 4-core limit, so under load IMS pods got squeezed to a sliver of a
    # core combined instead of the cores the ffmpeg jobs actually needed.
    requests:
      cpu: "1"
      memory: 512Mi
    limits:
      cpu: "3"
      memory: 2Gi
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
  kafka:
    # No request at all previously meant BestEffort-tier CPU shares, so
    # kafka-broker-api-versions.sh (the readiness probe, a JVM subprocess
    # with a 10s timeout) starved under load and flapped Unready.
    requests:
      cpu: 500m
      memory: 768Mi
