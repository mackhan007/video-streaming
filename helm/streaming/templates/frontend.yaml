apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "streaming.name" . }}-frontend-nginx
  labels:
    {{- include "streaming.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      client_max_body_size 8m;
      location /uploader/ { proxy_pass http://{{ include "streaming.name" . }}-ems:8080; }
      location /lister/ { proxy_pass http://{{ include "streaming.name" . }}-ems:8080; }
      location /streamer/ { proxy_pass http://{{ include "streaming.name" . }}-ems:8080; }
      location = /health { proxy_pass http://{{ include "streaming.name" . }}-ems:8080/health; }
      location = /ready { proxy_pass http://{{ include "streaming.name" . }}-ems:8080/ready; }
      location = /ims-health {
        proxy_pass http://{{ include "streaming.name" . }}-ims:8088/health;
      }
      location = /cdn-health {
        proxy_pass http://{{ include "streaming.name" . }}-nginx:80/;
      }
      location / { try_files $uri /index.html; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "streaming.name" . }}-frontend
  labels:
    {{- include "streaming.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.replicaCount.frontend }}
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: frontend
          image: {{ .Values.image.frontend }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
              name: http
          resources:
            {{- toYaml .Values.resources.frontend | nindent 12 }}
          volumeMounts:
            - name: nginx
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
      volumes:
        - name: nginx
          configMap:
            name: {{ include "streaming.name" . }}-frontend-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "streaming.name" . }}-frontend
  labels:
    {{- include "streaming.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.frontendType | default "ClusterIP" }}
  selector:
    app.kubernetes.io/component: frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.service.frontendPort }}
      targetPort: http
