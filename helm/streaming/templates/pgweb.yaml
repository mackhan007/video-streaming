apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "streaming.name" . }}-pgweb
  labels:
    {{- include "streaming.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgweb
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: pgweb
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: pgweb
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: pgweb
          image: {{ .Values.image.pgweb }}
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: PGWEB_DATABASE_URL
              value: {{ printf "postgres://%s:%s@%s-postgres:5432/%s?sslmode=disable" .Values.postgres.user .Values.postgres.password (include "streaming.name" .) .Values.postgres.database | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "streaming.name" . }}-pgweb
  labels:
    {{- include "streaming.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: pgweb
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 8081
      targetPort: http
