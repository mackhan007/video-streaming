apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "streaming.name" . }}-ems
  labels:
    {{- include "streaming.labels" . | nindent 4 }}
    app.kubernetes.io/component: ems
spec:
  replicas: {{ .Values.replicaCount.ems }}
  selector:
    matchLabels:
      app.kubernetes.io/component: ems
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ems
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: ems
          image: {{ .Values.image.ems }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "streaming.name" . }}-env
          env:
            - name: EMS_HTTP_PORT
              value: "8080"
          resources:
            {{- toYaml .Values.resources.ems | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 8
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "streaming.name" . }}-ems
  labels:
    {{- include "streaming.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: ems
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.service.emsPort }}
      targetPort: http
