apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "streaming.name" . }}-localstack-ui
  labels:
    {{- include "streaming.labels" . | nindent 4 }}
    app.kubernetes.io/component: localstack-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: localstack-ui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: localstack-ui
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: stackport
          image: {{ .Values.image.stackport }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: AWS_ENDPOINT_URL
              value: {{ printf "http://%s-localstack:4566" (include "streaming.name" .) | quote }}
            - name: AWS_REGION
              value: {{ .Values.env.AWS_DEFAULT_REGION | quote }}
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.env.AWS_ACCESS_KEY_ID | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.env.AWS_SECRET_ACCESS_KEY | quote }}
            - name: STACKPORT_ALLOW_WRITES
              value: "true"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "streaming.name" . }}-localstack-ui
  labels:
    {{- include "streaming.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: localstack-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 8080
      targetPort: http
