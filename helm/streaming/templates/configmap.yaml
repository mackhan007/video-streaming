apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "streaming.name" . }}-env
  labels:
    {{- include "streaming.labels" . | nindent 4 }}
data:
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgres:5432/%s" .Values.postgres.user .Values.postgres.password (include "streaming.name" .) .Values.postgres.database | quote }}
  REDIS_URL: {{ printf "redis://%s-redis:6379" (include "streaming.name" .) | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ printf "%s-kafka:29092" (include "streaming.name" .) | quote }}
  KAFKA_TOPIC: {{ .Values.env.KAFKA_TOPIC | quote }}
  KAFKA_GROUP_ID: {{ .Values.env.KAFKA_GROUP_ID | quote }}
  AWS_ENDPOINT_URL: {{ printf "http://%s-localstack:4566" (include "streaming.name" .) | quote }}
  S3_PUBLIC_ENDPOINT: {{ .Values.env.S3_PUBLIC_ENDPOINT | quote }}
  S3_BUCKET: {{ .Values.env.S3_BUCKET | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.env.AWS_ACCESS_KEY_ID | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.env.AWS_SECRET_ACCESS_KEY | quote }}
  AWS_DEFAULT_REGION: {{ .Values.env.AWS_DEFAULT_REGION | quote }}
  CDN_BASE_URL: {{ .Values.env.CDN_BASE_URL | quote }}
  HLS_SEGMENT_SECS: {{ .Values.env.HLS_SEGMENT_SECS | quote }}
  IMS_CHUNK_SECS: {{ .Values.ims.chunkSecs | quote }}
  IMS_ENCODE_PARALLEL: {{ .Values.ims.encodeParallel | quote }}
  FFMPEG_PRESET: {{ .Values.ims.preset | quote }}
  RUST_LOG: "ims_processor=info,ems_server=info,ems_upload=info,info"
