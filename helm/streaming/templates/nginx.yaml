apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "streaming.name" . }}-cdn-nginx
  labels:
    {{- include "streaming.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on;
      proxy_cache_path /var/cache/nginx/videos levels=1:2
        keys_zone=videos:10m max_size=1g inactive=7d use_temp_path=off;
      server {
        listen 80;
        server_name _;
        location = / {
          default_type text/plain;
          add_header Access-Control-Allow-Origin * always;
          return 200 'nginx CDN\n';
        }
        location /videos/ {
          proxy_pass http://{{ include "streaming.name" . }}-localstack:4566/videos/;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_cache videos;
          proxy_cache_valid 200 206 1d;
          add_header Access-Control-Allow-Origin * always;
          add_header X-Cache-Status $upstream_cache_status always;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "streaming.name" . }}-nginx
  labels:
    {{- include "streaming.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: nginx
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: nginx
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: nginx
          image: {{ .Values.image.nginx }}
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: cache
              mountPath: /var/cache/nginx/videos
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
      volumes:
        - name: conf
          configMap:
            name: {{ include "streaming.name" . }}-cdn-nginx
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "streaming.name" . }}-nginx
  labels:
    {{- include "streaming.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: nginx
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.service.cdnPort }}
      targetPort: http
