worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    proxy_cache_path /var/cache/nginx/videos
        levels=1:2
        keys_zone=videos:10m
        max_size=2g
        inactive=7d
        use_temp_path=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # StackPort EC2 page also fetches Auto Scaling groups.
    # Community LocalStack does not emulate autoscaling, so stub an empty list.
    server {
        listen 9008;
        server_name _;

        location = /api/ec2/asgs {
            default_type application/json;
            add_header Access-Control-Allow-Origin * always;
            return 200 '{"asgs":[]}';
        }

        location / {
            proxy_pass http://localstack-ui:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    server {
        listen 80;
        server_name _;

        location = / {
            default_type text/plain;
            add_header Access-Control-Allow-Origin * always;
            return 200 'nginx CDN — play HLS at /videos/hls/{file_id}/master.m3u8\n';
        }

        location ~* ^/videos/.+\.m3u8$ {
            proxy_pass http://localstack:4566;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache videos;
            proxy_cache_valid 200 5s;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Access-Control-Allow-Origin * always;
            add_header Content-Type application/vnd.apple.mpegurl always;
        }

        location /videos/ {
            proxy_pass http://localstack:4566/videos/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache videos;
            proxy_cache_valid 200 206 1d;
            proxy_cache_valid 404 10s;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Access-Control-Allow-Origin * always;
        }
    }
}
