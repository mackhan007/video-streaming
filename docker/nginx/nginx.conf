worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    proxy_cache_path /var/cache/nginx/videos
        levels=1:2
        keys_zone=videos:10m
        max_size=2g
        inactive=7d
        use_temp_path=off;

    server {
        listen 80;
        server_name _;

        location = / {
            default_type text/plain;
            add_header Access-Control-Allow-Origin * always;
            return 200 'nginx CDN — play HLS at /videos/hls/{file_id}/master.m3u8\n';
        }

        location ~* ^/videos/.+\.m3u8$ {
            proxy_pass http://minio:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # MinIO answers CORS itself when Origin is set; keep only nginx's header.
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_cache videos;
            proxy_cache_valid 200 5s;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Access-Control-Allow-Origin * always;
            add_header Content-Type application/vnd.apple.mpegurl always;
        }

        location /videos/ {
            proxy_pass http://minio:9000/videos/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_cache videos;
            proxy_cache_valid 200 206 1d;
            proxy_cache_valid 404 10s;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Access-Control-Allow-Origin * always;
        }
    }
}
